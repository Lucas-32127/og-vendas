<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OG VENDAS - Loja Oficial Angola</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial, sans-serif;background:#f0f2f5}
header{background:#0a2540;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:10}
header span{color:#ffcc00}
.top{background:#ffcc00;text-align:center;font-weight:bold;padding:7px;font-size:12px}
.banner{background:#0a2540;color:#fff;padding:28px 15px;text-align:center}
.btn-zap{background:#25D366;color:#fff;padding:14px 28px;border-radius:30px;text-decoration:none;display:inline-block;font-weight:bold;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative}
.card img{width:100%;height:145px;object-fit:cover}
.info{padding:10px}
.info h3{font-size:13px;min-height:32px}
.preco{color:#0a2540;font-weight:bold;font-size:15px;margin:6px 0}
.btn-comprar{width:100%;background:#0a2540;color:#fff;border:none;padding:9px;border-radius:8px;font-weight:bold;font-size:13px}
.rodape{background:#0a2540;color:white;text-align:center;padding:20px;margin-top:20px;font-size:12px}
.tag{background:red;color:white;font-size:9px;padding:2px 6px;border-radius:4px;position:absolute;margin:6px;z-index:2}
.btn-admin{position:fixed;bottom:15px;right:15px;background:#ffcc00;color:#000;padding:13px 20px;border-radius:30px;font-weight:bold;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:999;border:2px solid #0a2540;font-size:14px}
</style>
</head>
<body>
<header><h1>OG <span>VENDAS</span></h1><p>Entrega em Luanda - 950 978 388</p></header>
<div class="top">🚚 ENTREGA RÁPIDA EM LUANDA | PAGAMENTO NA ENTREGA</div>
<div class="banner">
<h2>Os mais vendidos de Angola</h2>
<p>Preço baixo e entrega hoje</p>
<a class="btn-zap" href="https://wa.me/244950978388?text=Ola%20OG%20VENDAS%20quero%20comprar">📲 COMPRAR NO WHATSAPP</a>
</div>

<div id="produtos" class="grid"></div>

<a href="admin.html" class="btn-admin">⚙️ ADMIN</a>

<div class="rodape">OG VENDAS ONLINE<br>📍 Luanda - Angola<br>📲 WhatsApp: 950 978 388<br>Pagamento na Entrega</div>

<script>
const padrao=[
{name:"Smartwatch T900 Ultra",preco:"15.000 Kz",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400",tag:"MAIS VENDIDO"},
{name:"Fone Bluetooth M10",preco:"8.500 Kz",img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400",tag:""},
{name:"Power Bank 20.000mAh",preco:"12.000 Kz",img:"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400",tag:""},
{name:"Coluna JBL Mini Go3",preco:"9.500 Kz",img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400",tag:""},
{name:"TV Box 4K Android",preco:"22.000 Kz",img:"https://images.unsplash.com/photo-1593359677879-a4bb92f367d8?w=400",tag:""},
{name:"Tripé + Luz Ring Light",preco:"13.500 Kz",img:"https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?w=400",tag:""},
{name:"Lâmpada LED RGB + Controle",preco:"5.500 Kz",img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400",tag:""},
{name:"Microfone Lapela Sem Fio",preco:"14.000 Kz",img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400",tag:"NOVO"}
];

let produtos = JSON.parse(localStorage.getItem('og_produtos')||'null') || padrao;

function render(){
  document.getElementById('produtos').innerHTML = produtos.map(p=>`
  <div class="card">
    ${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
    <img src="${p.img}">
    <div class="info">
      <h3>${p.name}</h3>
      <div class="preco">${p.preco}</div>
      <button class="btn-comprar" onclick="window.open('https://wa.me/244950978388?text=Quero%20${encodeURIComponent(p.name)}%20por%20${encodeURIComponent(p.preco)}')">COMPRAR</button>
    </div>
  </div>`).join('');
}
render();
</script>
</body>
</html>

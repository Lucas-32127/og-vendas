<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin OG VENDAS</title>
<style>body{font-family:Arial;background:#f0f2f5;padding:12px}.box{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:15px}input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;margin-top:8px}.btn-add{background:#0a2540;color:#fff}.btn-galeria{background:#ffcc00;color:#000;border:2px dashed #0a2540}.btn-del{background:#ff3b30;color:#fff;padding:6px;width:auto}.login{max-width:400px;margin:40px auto;text-align:center}#preview{width:100%;max-height:200px;object-fit:contain;margin-top:8px;border-radius:8px;display:none}.tab{display:flex;gap:6px;margin-bottom:10px}.tab button{flex:1;padding:10px;background:#ddd;color:#000}.tab button.ativo{background:#0a2540;color:#fff}</style>
</head><body>
<div id="login" class="box login"><h2>🔐 Admin OG VENDAS</h2><p style="font-size:13px;color:#666">Acesso restrito</p><input id="senha" type="password" placeholder="Digite sua senha secreta"><button class="btn-add" onclick="entrar()">ENTRAR</button></div>
<div id="painel" style="display:none">
<div class="tab"><button id="tabProd" class="ativo" onclick="aba('prod')">📦 Produtos</button><button id="tabCupom" onclick="aba('cupom')">🎟️ Cupons</button></div>
<div id="abaProd"><div class="box"><h3>Adicionar Produto</h3><input id="nome" placeholder="Nome"><input id="preco" placeholder="Preço ex: 15.000 Kz"><input id="valor" type="number" placeholder="Valor numérico ex: 15000"><button class="btn-galeria" onclick="document.getElementById('fotoInput').click()">📸 ESCOLHER FOTO DA GALERIA</button><input type="file" id="fotoInput" accept="image/*" style="display:none" onchange="lerFoto(this)"><img id="preview"><input id="img" type="hidden"><button class="btn-add" onclick="add()">✅ ADICIONAR</button></div><div class="box"><h3>Produtos (<span id="qtd"></span>)</h3><div id="lista"></div><button style="background:#25D366;color:white" onclick="location.href='index.html'">👁️ VER LOJA</button></div></div>
<div id="abaCupom" style="display:none"><div class="box"><h3>Criar Cupom</h3><input id="cupomCodigo" placeholder="Código ex: NATAL50"><select id="cupomTipo"><option value="percent">% OFF</option><option value="valor">Valor fixo Kz OFF</option><option value="frete">Frete Grátis</option></select><input id="cupomValor" type="number" placeholder="Valor"><input id="cupomMin" type="number" placeholder="Mínimo (0 = sem mínimo)"><button class="btn-add" onclick="addCupom()">🎟️ CRIAR CUPOM</button></div><div class="box"><h3>Cupons (<span id="qtdCupom"></span>)</h3><div id="listaCupom"></div></div></div>
</div>
<script>
const SENHA_SECRETA = "OG123"; // << MUDA AQUI PRA SUA SENHA SECRETA
const padrao=[{name:"Smartwatch T900 Ultra",preco:"15.000 Kz",valor:15000,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400",tag:"MAIS VENDIDO"},{name:"Fone Bluetooth M10",preco:"8.500 Kz",valor:8500,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400",tag:""},{name:"Power Bank 20.000mAh",preco:"12.000 Kz",valor:12000,img:"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400",tag:""},{name:"Coluna JBL Mini",preco:"9.500 Kz",valor:9500,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400",tag:""},{name:"TV Box 4K",preco:"22.000 Kz",valor:22000,img:"https://images.unsplash.com/photo-1593359677879-a4bb92f367d8?w=400",tag:""},{name:"Ring Light Tripé",preco:"13.500 Kz",valor:13500,img:"https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?w=400",tag:""},{name:"Lâmpada RGB",preco:"5.500 Kz",valor:5500,img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400",tag:""},{name:"Microfone Lapela",preco:"14.000 Kz",valor:14000,img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400",tag:"NOVO"}];
const cupomPadrao=[{codigo:"OG10",tipo:"percent",valor:10,min:0},{codigo:"OG20",tipo:"percent",valor:20,min:30000},{codigo:"FRETE",tipo:"frete",valor:0,min:0}];
function entrar(){if(senha.value===SENHA_SECRETA){login.style.display='none';painel.style.display='block';carregar();carregarCupom()}else alert('Senha errada')}
let produtos=JSON.parse(localStorage.getItem('og_produtos')||'null')||padrao;let cupons=JSON.parse(localStorage.getItem('og_cupons')||'null')||cupomPadrao;
function aba(t){document.getElementById('abaProd').style.display=t=='prod'?'block':'none';document.getElementById('abaCupom').style.display=t=='cupom'?'block':'none';document.getElementById('tabProd').classList.toggle('ativo',t=='prod');document.getElementById('tabCupom').classList.toggle('ativo',t=='cupom')}
function lerFoto(input){if(input.files&&input.files[0]){let r=new FileReader();r.onload=e=>{img.value=e.target.result;preview.src=e.target.result;preview.style.display='block'};r.readAsDataURL(input.files[0])}}
function salvar(){localStorage.setItem('og_produtos',JSON.stringify(produtos));carregar()}
function carregar(){qtd.innerText=produtos.length;lista.innerHTML=produtos.map((p,i)=>`<div style="display:flex;gap:8px;align-items:center;margin:8px 0;border-bottom:1px solid #eee;padding-bottom:8px"><img src="${p.img}" style="width:50px;height:50px;object-fit:cover;border-radius:8px"><div style="flex:1"><b style="font-size:12px">${p.name}</b><br>${p.preco}</div><button class="btn-del" onclick="del(${i})">X</button></div>`).join('')}
function add(){let n=nome.value,p=preco.value,v=parseInt(valor.value)||0,i=img.value;if(!n||!p||!i||!v)return alert('Preencha tudo');produtos.unshift({name:n,preco:p,valor:v,img:i,tag:''});nome.value=preco.value=valor.value=img.value='';preview.style.display='none';salvar()}
function del(i){if(confirm('Apagar?')){produtos.splice(i,1);salvar()}}
function salvarCupom(){localStorage.setItem('og_cupons',JSON.stringify(cupons));carregarCupom()}
function carregarCupom(){qtdCupom.innerText=cupons.length;listaCupom.innerHTML=cupons.map((c,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0"><div><b>${c.codigo}</b><br><span style="font-size:11px">${c.tipo=='percent'?c.valor+'% OFF':c.tipo=='valor'?c.valor+' Kz OFF':'Frete Grátis'} ${c.min>0?'(Min '+c.min+' Kz)':''}</span></div><button class="btn-del" onclick="delCupom(${i})">X</button></div>`).join('')}
function addCupom(){let cod=cupomCodigo.value.trim().toUpperCase();let tipo=cupomTipo.value;let val=parseInt(cupomValor.value)||0;let min=parseInt(cupomMin.value)||0;if(!cod)return alert('Digite código');if(cupons.find(c=>c.codigo==cod))return alert('Já existe');cupons.push({codigo:cod,tipo,valor:val,min});cupomCodigo.value=cupomValor.value=cupomMin.value='';salvarCupom()}
function delCupom(i){if(confirm('Apagar cupom?')){cupons.splice(i,1);salvarCupom()}}
</script></body></html>

<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OG VENDAS - Oficial</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f0f2f5}header{background:#0a2540;color:#fff;padding:14px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}header span{color:#ffcc00}#carrinhoBtn{background:#ffcc00;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;position:relative}#carrinhoBtn span{background:red;color:#fff;border-radius:50%;padding:2px 6px;font-size:11px;position:absolute;top:-6px;right:-6px}.top{background:#ffcc00;text-align:center;font-weight:bold;padding:6px;font-size:11px}.banner{background:#0a2540;color:#fff;padding:18px 15px;text-align:center}.btn-zap{background:#25D366;color:#fff;padding:12px 24px;border-radius:30px;text-decoration:none;display:inline-block;font-weight:bold;margin-top:10px;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;padding-bottom:80px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative}.card img{width:100%;height:135px;object-fit:cover}.info{padding:8px}.info h3{font-size:12px;min-height:32px}.preco{color:#0a2540;font-weight:bold;font-size:14px;margin:4px 0}.btn-add{width:100%;background:#0a2540;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:bold;font-size:12px}#carrinhoModal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none}#carrinhoBox{background:#fff;width:92%;max-width:380px;max-height:90vh;overflow:auto;margin:3% auto;border-radius:16px;padding:15px}.itemCart{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}.itemCart img{width:50px;height:50px;object-fit:cover;border-radius:8px}.qtdBtn{border:1px solid #ccc;background:#fff;padding:3px 8px;border-radius:6px}.btn-final{background:#25D366;color:#fff;width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:12px}.cupomBox{background:#fff7cc;border:2px dashed #ffcc00;padding:10px;border-radius:10px;margin:10px 0}.cupomBox input{width:68%;padding:8px;border:1px solid #ccc;border-radius:6px}.cupomBox button{width:30%;padding:8px;background:#0a2540;color:#fff;border:none;border-radius:6px;font-weight:bold}.btn-admin{position:fixed;bottom:15px;left:15px;background:#000;color:#ffcc00;padding:8px 14px;border-radius:20px;font-size:11px;text-decoration:none;border:1px solid #ffcc00}</style>
</head><body>
<header><div><h2>OG <span>VENDAS</span></h2><p style="font-size:10px">950 978 388</p></div><button id="carrinhoBtn" onclick="abrirCarrinho()">🛒 <span id="qtdCarrinho">0</span></button></header>
<div class="top">🎉 CARRINHO LIBERADO - ADICIONA 5 OU + PRODUTOS!</div>
<div class="banner"><h3>OG VENDAS - ENTREGA EM LUANDA</h3><p style="font-size:12px;margin-top:5px" id="cuponsTxt"></p><a class="btn-zap" href="#" onclick="abrirCarrinho();return false">🛒 VER CARRINHO</a></div>
<div id="produtos" class="grid"></div>
<div id="carrinhoModal" onclick="if(event.target==this)fecharCarrinho()"><div id="carrinhoBox"><h3>🛒 Meu Carrinho</h3><div id="listaCarrinho" style="margin:12px 0"></div><div class="cupomBox"><b style="font-size:12px">🎟️ CUPOM</b><div style="display:flex;gap:4px;margin-top:6px"><input id="cupomInput" placeholder="OG10"><button onclick="aplicarCupom()">OK</button></div><p id="cupomMsg" style="font-size:11px;margin-top:5px"></p></div><div style="border-top:2px solid #0a2540;padding-top:10px"><p>Subtotal: <b id="subtotal">0 Kz</b></p><p style="color:green">Desconto: - <b id="desconto">0 Kz</b></p><p style="font-size:16px">Total: <b id="totalFinal">0 Kz</b></p><p style="font-size:11px"><span id="totalItens">0</span> itens | <span id="freteTxt"></span></p><button class="btn-final" onclick="finalizar()">✅ FINALIZAR NO WHATSAPP</button><button style="width:100%;padding:10px;margin-top:8px;border:1px solid #ccc;background:#fff;border-radius:10px" onclick="fecharCarrinho()">Continuar comprando</button></div></div></div>
<a href="admin.html" class="btn-admin">⚙️ ADMIN</a>
<script>
const padrao=[{name:"Timberland",preco:"12.000 Kz",valor:12000,img:"https://images.unsplash.com/photo-1600269452121-4f2416e55c28?w=400"},{name:"Smartwatch T900 Ultra",preco:"15.000 Kz",valor:15000,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"},{name:"Fone Bluetooth M10",preco:"8.500 Kz",valor:8500,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400"},{name:"Power Bank 20.000mAh",preco:"12.000 Kz",valor:12000,img:"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400"},{name:"Coluna JBL Mini",preco:"9.500 Kz",valor:9500,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400"},{name:"TV Box 4K",preco:"22.000 Kz",valor:22000,img:"https://images.unsplash.com/photo-1593359677879-a4bb92f367d8?w=400"},{name:"Ring Light",preco:"13.500 Kz",valor:13500,img:"https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?w=400"},{name:"Lâmpada RGB",preco:"5.500 Kz",valor:5500,img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400"}];
const cupomPadrao=[{codigo:"OG10",tipo:"percent",valor:10,min:0},{codigo:"OG20",tipo:"percent",valor:20,min:30000},{codigo:"FRETE",tipo:"frete",valor:0,min:0}];
let produtos=JSON.parse(localStorage.getItem('og_produtos')||'null')||padrao;let carrinho=JSON.parse(localStorage.getItem('og_carrinho')||'[]');let cupons=JSON.parse(localStorage.getItem('og_cupons')||'null')||cupomPadrao;
let descontoValor=0,cupomAtivo='',freteGratis=false;
function render(){document.getElementById('produtos').innerHTML=produtos.map((p,i)=>`<div class="card"><img src="${p.img}"><div class="info"><h3>${p.name}</h3><div class="preco">${p.preco}</div><button id="btn${i}" class="btn-add" onclick="addCarrinho(${i})">+ CARRINHO</button></div></div>`).join('');document.getElementById('cuponsTxt').innerText='Cupons: '+cupons.map(c=>c.codigo).join(' | ');atualizaQtd();}
function addCarrinho(i){let prod=produtos[i];let ex=carrinho.find(c=>c.name==prod.name);if(ex){ex.qtd++}else{carrinho.push({...prod,qtd:1})}salvar();let btn=document.getElementById('btn'+i);btn.innerText='✅';setTimeout(()=>btn.innerText='+ CARRINHO',800);}
function salvar(){localStorage.setItem('og_carrinho',JSON.stringify(carrinho));atualizaQtd();calcTotal();}
function atualizaQtd(){let t=carrinho.reduce((s,c)=>s+c.qtd,0);document.getElementById('qtdCarrinho').innerText=t;document.getElementById('totalItens').innerText=t;}
function abrirCarrinho(){renderCarrinho();calcTotal();document.getElementById('carrinhoModal').style.display='block';}
function fecharCarrinho(){document.getElementById('carrinhoModal').style.display='none'}
function renderCarrinho(){if(carrinho.length==0){document.getElementById('listaCarrinho').innerHTML='<p style="text-align:center;padding:20px">Vazio - adiciona 5 produtos!</p>';return}document.getElementById('listaCarrinho').innerHTML=carrinho.map((c,i)=>`<div class="itemCart"><img src="${c.img}"><div style="flex:1"><b style="font-size:12px">${c.name}</b><br>${c.preco}</div><div><button class="qtdBtn" onclick="mudaQtd(${i},-1)">-</button> ${c.qtd} <button class="qtdBtn" onclick="mudaQtd(${i},1)">+</button> <button style="border:none;background:none;color:red" onclick="remove(${i})">✕</button></div></div>`).join('');}
function mudaQtd(i,d){carrinho[i].qtd+=d;if(carrinho[i].qtd<=0)carrinho.splice(i,1);salvar();renderCarrinho();}
function remove(i){carrinho.splice(i,1);salvar();renderCarrinho();}
function calcTotal(){let sub=carrinho.reduce((s,c)=>s+(c.valor||0)*c.qtd,0);let total=sub-descontoValor;if(total<0)total=0;document.getElementById('subtotal').innerText=sub.toLocaleString()+' Kz';document.getElementById('desconto').innerText=descontoValor.toLocaleString()+' Kz';document.getElementById('totalFinal').innerText=total.toLocaleString()+' Kz';document.getElementById('freteTxt').innerText=freteGratis?'Frete Grátis':'Frete 2.000 Kz';}
function aplicarCupom(){let cup=document.getElementById('cupomInput').value.trim().toUpperCase();let sub=carrinho.reduce((s,c)=>s+(c.valor||0)*c.qtd,0);let achado=cupons.find(c=>c.codigo==cup);let msg=document.getElementById('cupomMsg');descontoValor=0;freteGratis=false;cupomAtivo='';if(!achado){msg.innerText='❌ Inválido';msg.style.color='red';calcTotal();return}if(sub<(achado.min||0)){msg.innerText='Min '+achado.min+' Kz';msg.style.color='red';calcTotal();return}if(achado.tipo=='percent'){descontoValor=Math.round(sub*achado.valor/100);cupomAtivo=achado.codigo;msg.innerText='✅ '+achado.valor+'% OFF';msg.style.color='green';}else if(achado.tipo=='valor'){descontoValor=achado.valor;cupomAtivo=achado.codigo;msg.innerText='✅ -'+achado.valor+' Kz';msg.style.color='green';}else{freteGratis=true;cupomAtivo=achado.codigo;msg.innerText='✅ Frete Grátis';msg.style.color='green';}calcTotal();}
function finalizar(){if(carrinho.length==0)return alert('Vazio');let sub=carrinho.reduce((s,c)=>s+(c.valor||0)*c.qtd,0);let total=sub-descontoValor;let txt='Ola OG VENDAS! Pedido:\n\n';carrinho.forEach(c=>{txt+=c.qtd+'x '+c.name+' - '+c.preco+'\n'});txt+='\nSubtotal: '+sub+' Kz\n';if(cupomAtivo)txt+='Cupom '+cupomAtivo+': -'+descontoValor+' Kz\n';txt+='TOTAL: '+total+' Kz\nItens: '+carrinho.reduce((s,c)=>s+c.qtd,0);window.open('https://wa.me/244950978388?text='+encodeURIComponent(txt));}
render();calcTotal();
</script></body></html>

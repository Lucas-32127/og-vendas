<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin OG</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:12px}
.box{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold}
.btn{background:#0a2540;color:#fff}
.btn-yellow{background:#ffcc00;color:#000;border:2px dashed #000}
.btn-red{background:red;color:#fff;width:auto;padding:6px 10px}
#preview{width:100%;max-height:180px;object-fit:contain;display:none;margin-top:8px;border-radius:8px}
</style>
</head>
<body>

<div id="telaLogin" class="box" style="max-width:400px;margin:40px auto;text-align:center">
<h2>🔐 Admin OG VENDAS</h2>
<p>Acesso restrito</p>
<input id="senhaInput" type="password" placeholder="Digite sua senha secreta">
<button class="btn" onclick="fazerLogin()">ENTRAR</button>
<br><br>
<a href="https://lucas-32127.github.io/og-vendas/" style="color:#0a2540;font-weight:bold">🏠 Ir para Loja - Link Direto</a>
</div>

<div id="telaPainel" style="display:none">
<div class="box">
<h3>Adicionar Produto</h3>
<input id="nome" placeholder="Nome ex: Timberland">
<input id="preco" placeholder="Preço ex: 12.000 Kz">
<input id="valor" type="number" placeholder="Valor número ex: 12000">
<button class="btn-yellow" onclick="document.getElementById('foto').click()">📸 ESCOLHER FOTO DA GALERIA</button>
<input type="file" id="foto" accept="image/*" style="display:none" onchange="fotoLida(this)">
<img id="preview">
<input id="imgBase64" type="hidden">
<button class="btn" onclick="salvarProduto()">✅ ADICIONAR NA LOJA</button>
</div>

<div class="box">
<h3>Produtos (<span id="qtd"></span>)</h3>
<div id="lista"></div>
<br>
<a href="https://lucas-32127.github.io/og-vendas/" target="_blank" style="display:block;background:#25D366;color:#fff;text-align:center;padding:14px;border-radius:10px;text-decoration:none;font-weight:bold">👁️ VER LOJA AGORA - LINK COMPLETO</a>
<br>
<button onclick="sair()" style="background:#eee;color:#000">Sair do Admin</button>
</div>
</div>

<script>
const SENHA = "OG123";
const padrao=[{name:"Timberland",preco:"12.000 Kz",valor:12000,img:"https://images.unsplash.com/photo-1600269452121-4f2416e55c28?w=400"},{name:"Smartwatch T900 Ultra",preco:"15.000 Kz",valor:15000,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"},{name:"Fone Bluetooth M10",preco:"8.500 Kz",valor:8500,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400"},{name:"Power Bank 20.000mAh",preco:"12.000 Kz",valor:12000,img:"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400"}];

function verificarLogin(){
 if(localStorage.getItem('og_logado')==='sim'){
  document.getElementById('telaLogin').style.display='none';
  document.getElementById('telaPainel').style.display='block';
  carregar();
 }
}
function fazerLogin(){
 let s=document.getElementById('senhaInput').value;
 if(s===SENHA){
  localStorage.setItem('og_logado','sim');
  document.getElementById('telaLogin').style.display='none';
  document.getElementById('telaPainel').style.display='block';
  carregar();
 } else { alert('Senha errada! É OG123'); }
}
function sair(){
 localStorage.removeItem('og_logado');
 location.reload();
}
let produtos=JSON.parse(localStorage.getItem('og_produtos')||'null')||padrao;
function fotoLida(input){
 if(input.files && input.files[0]){
  let r=new FileReader();
  r.onload=e=>{
   document.getElementById('imgBase64').value=e.target.result;
   document.getElementById('preview').src=e.target.result;
   document.getElementById('preview').style.display='block';
  };
  r.readAsDataURL(input.files[0]);
 }
}
function salvarTodos(){localStorage.setItem('og_produtos',JSON.stringify(produtos));carregar();}
function carregar(){
 document.getElementById('qtd').innerText=produtos.length;
 document.getElementById('lista').innerHTML=produtos.map((p,i)=>`<div style="display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:8px 0"><img src="${p.img}" style="width:50px;height:50px;object-fit:cover;border-radius:8px"><div style="flex:1"><b style="font-size:12px">${p.name}</b><br>${p.preco}</div><button class="btn-red" onclick="apagar(${i})">X</button></div>`).join('');
}
function salvarProduto(){
 let n=document.getElementById('nome').value;
 let p=document.getElementById('preco').value;
 let v=parseInt(document.getElementById('valor').value)||0;
 let i=document.getElementById('imgBase64').value;
 if(!n||!p||!v||!i)return alert('Preencha nome, preço, valor e foto');
 produtos.unshift({name:n,preco:p,valor:v,img:i});
 document.getElementById('nome').value='';
 document.getElementById('preco').value='';
 document.getElementById('valor').value='';
 document.getElementById('imgBase64').value='';
 document.getElementById('preview').style.display='none';
 salvarTodos();
 alert('Adicionado! Agora tem '+produtos.length+' produtos');
}
function apagar(i){if(confirm('Apagar?')){produtos.splice(i,1);salvarTodos();}}
verificarLogin();
</script>
</body>
</html>
